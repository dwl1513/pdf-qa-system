name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: "claude-sonnet-4-6"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "claude-sonnet-4-6"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          CLAUDE_CODE_ATTRIBUTION_HEADER: "0"
          CLAUDE_CODE_DISABLE_ADAPTIVE_THINKING: "1"
          MAX_THINKING_TOKENS: "64000"
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: "128000"
        with:
          track_progress: true
          anthropic_api_key: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git log:*),Bash(git show:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            Review this pull request now, in this single run. Use the available tools to
            read the diff (`gh pr diff`, `gh pr view`, `git show`) and post your findings
            as inline comments and/or a summary `gh pr comment` BEFORE you finish. Do not
            reply with "I'll get back to you" or defer the work — complete the review here.

            You are reviewing a PR for `pdf-qa-system` — a PDF question-answering system
            built on RAG (retrieval-augmented generation). Stack: FastAPI + Gradio for the
            app layer, LangChain for orchestration, ChromaDB as the vector store, and the
            Zhipu (智谱) GLM-4-Flash LLM + embedding-3 model via an OpenAI-compatible API.
            Retrieval is hybrid: vector + BM25 (jieba-tokenized) fused with RRF, then a
            BGE cross-encoder reranker. Key modules: `main.py` (FastAPI routes + Gradio UI),
            `rag/loader.py` (PDF load & split), `rag/chain.py` (vectorstore + retriever + QA chain).

            **Language policy**: Code comments and commit messages must be in English.
            PR review comments must be written in Chinese (中文).

            **Import convention**: Project code uses absolute imports rooted at the repo
            (`from rag.chain import build_qa_chain`, `from rag.loader import load_and_split`).
            Tests rely on `tests/conftest.py` putting the repo root on `sys.path`. Flag
            relative imports between top-level modules — that's a bug here, not style.

            **TDD requirement**: Any new feature or behavior change MUST have corresponding
            tests in `tests/test_*.py`. Flag PRs that add logic without tests.

            **Focus your review on**:
            1. Logic bugs and off-by-one errors (e.g. page-number `+1` offsets, batch
               slicing in `build_vectorstore`, chunk overlap math).
            2. Unhandled exception paths — file I/O (PDF upload/save), network calls to the
               Zhipu API, and the SSE streaming generators in `/chat` and `answer_question`.
            3. Streaming correctness: the `astream_events` event handling, `[DONE]` framing,
               and that errors are surfaced to the client rather than silently swallowed.
            4. Retrieval correctness in `rag/chain.py`: BM25 tokenization, EnsembleRetriever
               weights/RRF, reranker `top_n`, and the `recall_k` / `rerank_top_n` plumbing.
            5. Resource & state issues: the module-global `current_qa_chain` (concurrency,
               request isolation), file handles, and uploaded-file path handling.
            6. Deviations from the import convention above.
            7. Missing tests for new logic.

            **Do NOT comment on**:
            - Pure style issues (ruff handles formatting and lint).
            - Over-abstraction or refactoring suggestions unless the code is actively broken.
            - Hypothetical future requirements (multi-PDF, persistence, Docker, etc.).

            Be concise. One finding per section.