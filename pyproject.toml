[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-qa-system"
version = "0.1.0"
description = "PDF RAG question answering system"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "python-dotenv",
  "openai",
  "langchain",
  "langchain-classic",
  "langchain-openai",
  "langchain-community",
  "langchain-text-splitters",
  "langchain-core",
  "chromadb",
  "pypdf",
  "gradio",
  "numpy",
  "jieba",
  "rank_bm25",
  "sentence-transformers",
  "pytest",
  "ruff",
]

[project.optional-dependencies]
osproxy = []

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = ["F401"]
